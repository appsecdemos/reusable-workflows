name: Dependabot automerge

on:
  workflow_call:
    inputs:
      dry_run:
        description: Report eligible PRs without creating an App token or merging
        type: boolean
        default: true
    secrets:
      app_client_id:
        required: false
      app_private_key:
        required: false

permissions:
  contents: read
  pull-requests: read

jobs:
  automerge:
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    steps:
      - name: Identify Dependabot PR
        id: pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const run = context.payload.workflow_run;
            if (context.payload.action !== 'completed' || run?.event !== 'pull_request' ||
                run.conclusion !== 'success' || !/^[0-9a-f]{40}$/.test(run.head_sha ?? '')) {
              core.info('Denied: trigger is not a successful PR workflow run with a valid revision.');
              return;
            }

            const { owner, repo } = context.repo;
            const { data: repository } = await github.rest.repos.get({ owner, repo });
            if (!Number.isSafeInteger(repository.id) || !repository.default_branch) {
              throw new Error('Repository identity or default branch is unavailable.');
            }
            const associated = await github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit, {
              owner, repo, commit_sha: run.head_sha, per_page: 100
            });
            const candidates = associated.filter(pr => pr.state === 'open' && pr.head.sha === run.head_sha);
            if (candidates.length !== 1) {
              core.info('Denied: the triggering revision does not identify exactly one open PR.');
              return;
            }
            const { data: pr } = await github.rest.pulls.get({
              owner, repo, pull_number: candidates[0].number
            });
            if (pr.state !== 'open' || pr.draft !== false ||
                pr.user?.login !== 'dependabot[bot]' || pr.user?.id !== 49699333 || pr.user?.type !== 'Bot' ||
                pr.head.sha !== run.head_sha || pr.head.repo?.id !== repository.id ||
                pr.base.repo?.id !== repository.id || pr.base.ref !== repository.default_branch) {
              core.info(`Denied: PR #${pr.number} identity, origin, target, or head revision did not match.`);
              return;
            }
            core.info(`Eligible: PR #${pr.number} at ${run.head_sha}. GitHub enforces required CI at merge time.`);
            core.setOutput('number', pr.number);
            core.setOutput('head_sha', run.head_sha);
            core.setOutput('eligible', 'true');

      - name: Report dry run
        if: steps.pr.outputs.eligible == 'true' && inputs.dry_run
        run: |
          echo 'Dry run: a squash merge would be attempted; required CI was not evaluated here.'

      - name: Create repository-scoped App token
        if: steps.pr.outputs.eligible == 'true' && !inputs.dry_run
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.app_client_id }}
          private-key: ${{ secrets.app_private_key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: read

      - name: Recheck and squash merge
        if: steps.pr.outputs.eligible == 'true' && !inputs.dry_run
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: |
            const { owner, repo } = context.repo;
            const pull_number = Number(process.env.PR_NUMBER);
            const sha = process.env.HEAD_SHA;
            if (!Number.isSafeInteger(pull_number) || pull_number < 1 || !/^[0-9a-f]{40}$/.test(sha ?? '')) {
              throw new Error('PR number or expected revision is invalid.');
            }
            const { data: repository } = await github.rest.repos.get({ owner, repo });
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number });
            if (!Number.isSafeInteger(repository.id) || !repository.default_branch ||
                pr.state !== 'open' || pr.draft !== false ||
                pr.user?.login !== 'dependabot[bot]' || pr.user?.id !== 49699333 || pr.user?.type !== 'Bot' ||
                pr.head.sha !== sha || pr.head.repo?.id !== repository.id ||
                pr.base.repo?.id !== repository.id || pr.base.ref !== repository.default_branch) {
              throw new Error(`Denied: PR #${pull_number} identity, origin, target, or head revision did not match.`);
            }
            core.info(`Attempting squash merge of PR #${pull_number} at ${sha}.`);
            const { data: result } = await github.rest.pulls.merge({
              owner, repo, pull_number, sha, merge_method: 'squash'
            });
            if (result.merged !== true) {
              throw new Error(`GitHub did not confirm the merge of PR #${pull_number}.`);
            }
            core.info(`Merged PR #${pull_number}.`);
